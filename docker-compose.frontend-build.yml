# Slow frontend image build (npm install + vite/webpack). Use only when Vue changes:
#   ./scripts/build-frontend.sh
# or:
#   docker compose -f docker-compose.yml -f docker-compose.frontend-build.yml build frontend

services:
  frontend:
    pull_policy: build
    build:
      context: ${FRONTEND_SRC_PATH:-../startlink-web}
      dockerfile: Dockerfile
